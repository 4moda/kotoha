name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust Lint (fmt & clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cpp-lint:
    name: C++ Lint (clang-format & clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM tooling (clang-format, clang-tidy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format clang-tidy cmake ninja-build

      - name: Check C++ formatting (clang-format)
        run: |
          find plugins \( -path 'plugins/build' -o -path 'plugins/mumble/third_party' \) -prune \
            -o -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

      - name: Configure CMake for compile_commands.json
        run: |
          cmake -S plugins -B plugins/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKOTOHA_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy on C++ sources
        run: |
          find plugins \( -path 'plugins/build' -o -path 'plugins/mumble/third_party' \) -prune \
            -o -type f -name '*.cpp' -print0 \
            | xargs -0 -r clang-tidy -p plugins/build

  ui-ci:
    name: UI Lint, Typecheck, Unit & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
          retention-days: 7

  matrix-build-test-e2e:
    name: Build, Unit Tests & Cross-Language E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Configure C++ plugins (CMake)
        run: cmake -S plugins -B plugins/build -DCMAKE_BUILD_TYPE=Release -DKOTOHA_WARNINGS_AS_ERRORS=ON

      - name: Build C++ plugins
        run: cmake --build plugins/build --config Release --parallel

      - name: Run C++ unit & ABI tests (CTest)
        run: ctest --test-dir plugins/build -C Release --output-on-failure

      - name: Build Rust IPC monitor (Release)
        run: cargo build --release --bin kotoha-ipc-monitor

      - name: Run Rust workspace unit & Cross-Language IPC E2E tests (nextest)
        run: cargo nextest run --workspace

  real-audio-e2e:
    name: Real-Audio E2E (C++ IPC -> sherpa-onnx STT -> HTTP Translation)
    runs-on: ubuntu-latest
    env:
      SHERPA_ONNX_VERSION: "v2.0.3"
      SHERPA_ARCHIVE_NAME: "sherpa-onnx-v2.0.3-linux-x64-static-lib"
      ZIPFORMER_MODEL_NAME: "sherpa-onnx-streaming-zipformer-en-20M-2023-02-17-mobile"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-real-audio-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-real-audio-e2e-

      - name: Build C++ kotoha_mock_client (Release)
        run: |
          cmake -S plugins -B plugins/build -DCMAKE_BUILD_TYPE=Release -DKOTOHA_WARNINGS_AS_ERRORS=ON
          cmake --build plugins/build --config Release --target kotoha_mock_client --parallel

      - name: Cache sherpa-onnx v2.0.3 Linux x64 static libraries
        id: cache-sherpa-lib
        uses: actions/cache@v4
        with:
          path: ~/.cache/kotoha-ci/sherpa-onnx-v2.0.3-linux-x64-static-lib
          key: sherpa-onnx-${{ env.SHERPA_ONNX_VERSION }}-linux-x64-static-lib-v1

      - name: Download and extract sherpa-onnx v2.0.3 static libraries
        if: steps.cache-sherpa-lib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/kotoha-ci
          archive_url="https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/${SHERPA_ARCHIVE_NAME}.tar.bz2"
          tmp_archive="$(mktemp /tmp/sherpa-onnx-lib-XXXXXX.tar.bz2)"
          trap 'rm -f "${tmp_archive}"' EXIT
          curl -fLsS --retry 3 --retry-delay 5 "${archive_url}" -o "${tmp_archive}"
          tar -xjf "${tmp_archive}" -C ~/.cache/kotoha-ci

      - name: Cache Zipformer English 20M streaming model
        id: cache-zipformer-model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kotoha-ci/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17-mobile
          key: zipformer-en-20m-2023-02-17-mobile-v1

      - name: Download and extract Zipformer English 20M streaming model
        if: steps.cache-zipformer-model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/kotoha-ci
          model_url="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${ZIPFORMER_MODEL_NAME}.tar.bz2"
          tmp_model="$(mktemp /tmp/zipformer-model-XXXXXX.tar.bz2)"
          trap 'rm -f "${tmp_model}"' EXIT
          curl -fLsS --retry 3 --retry-delay 5 "${model_url}" -o "${tmp_model}"
          tar -xjf "${tmp_model}" -C ~/.cache/kotoha-ci

      - name: Clippy native sherpa-onnx STT & real-audio E2E crates
        run: |
          export SHERPA_ONNX_LIB_DIR="${HOME}/.cache/kotoha-ci/${SHERPA_ARCHIVE_NAME}/lib"
          cargo clippy -p kotoha-stt-sherpa --all-targets --features native-sherpa -- -D warnings
          cargo clippy -p kotoha-e2e --all-targets --features real-audio-e2e -- -D warnings

      - name: Run Real-Audio E2E pipeline (nextest)
        run: |
          export SHERPA_ONNX_LIB_DIR="${HOME}/.cache/kotoha-ci/${SHERPA_ARCHIVE_NAME}/lib"
          export KOTOHA_E2E_MODEL_DIR="${HOME}/.cache/kotoha-ci/${ZIPFORMER_MODEL_NAME}"
          cargo nextest run -p kotoha-e2e --features real-audio-e2e --test real_audio_pipeline --no-capture
