[workspace]
resolver = "2"
members = [
    "crates/kotoha-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4moda/kotoha"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
thiserror = "2.0"
