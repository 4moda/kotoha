[workspace]
resolver = "2"
members = [
    "crates/kotoha-protocol",
    "crates/kotoha-core",
    "crates/kotoha-stt-sherpa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4moda/kotoha"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
async-trait = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
kotoha-core = { path = "crates/kotoha-core" }
kotoha-protocol = { path = "crates/kotoha-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = "2.0.3"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
