[workspace]
resolver = "2"
members = [
    "crates/kotoha-protocol",
    "crates/kotoha-core",
    "crates/kotoha-stt-sherpa",
    "crates/kotoha-translate-http",
    "crates/kotoha-translate-local",
    "crates/kotoha-setup",
    "crates/kotoha-e2e",
]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4moda/kotoha"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
async-trait = "0.1"
ct2rs = "0.11.3"
interprocess = { version = "2.4", features = ["tokio"] }
kotoha-core = { path = "crates/kotoha-core" }
kotoha-protocol = { path = "crates/kotoha-protocol" }
kotoha-stt-sherpa = { path = "crates/kotoha-stt-sherpa" }
kotoha-translate-http = { path = "crates/kotoha-translate-http" }
kotoha-translate-local = { path = "crates/kotoha-translate-local" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sherpa-onnx = "2.0.3"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
